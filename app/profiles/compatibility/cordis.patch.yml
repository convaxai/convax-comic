# Compatibility keeps the upstream Web client roster unchanged. The Host-only
# desktop and security rows are mandatory product infrastructure, not client
# presentation overrides.
- id: webserver
  name: '@deepseek-ai/dsh-host-webserver'
  disabled: true
  config:
    host: 127.0.0.1
    port: 0

- id: web-runtime
  name: '@deepseek-ai/dsh-web-app'
  config:
    openBrowser: false
    printUrl: false
    surfaceContext: true
    trustedHosts: []

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: workspace-write

- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: ask

- id: permission
  name: '@deepseek-ai/dsh-permission-presets'
  config:
    defaultPreset: workspace-write
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask

- id: agent-presets
  name: '@deepseek-ai/dsh-agent-presets'
  disabled: true

- insert:
    - id: app-agent-presets
      name: '@convax/agent-presets'
      config:
        default: standard

    - id: app-auth-fence
      name: '@convax/auth-fence'
      inject: [webStartup]
      config:
        host: 127.0.0.1
        port: 0

    - id: app-command-guard
      name: '@convax/command-guard'

    - id: app-desktop-host
      name: '@convax/desktop'

    # Host-only shared database capability; it opens no database until a
    # product plugin acquires an owner-scoped lease.
    - id: app-sqlite-runtime
      name: '@convax/sqlite-runtime'
