# Default inherits the compatibility security posture. @convax/ui replaces the
# documented brand and settings-shell slots; Project owns the root slot and
# hosts the official conversation in its right pane.
- id: webserver
  name: '@deepseek-ai/dsh-host-webserver'
  disabled: true
  config:
    host: 127.0.0.1
    port: 0

- id: web-runtime
  name: '@deepseek-ai/dsh-web-app'
  config:
    openBrowser: false
    printUrl: false
    surfaceContext: true
    trustedHosts: []

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: workspace-write

- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: ask

- id: permission
  name: '@deepseek-ai/dsh-permission-presets'
  config:
    defaultPreset: workspace-write
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask

- id: agent-presets
  name: '@deepseek-ai/dsh-agent-presets'
  disabled: true

- id: ui-brand-official
  name: '@deepseek-ai/dsh-client-ui-brand-official'
  disabled: true

- id: ui-layout
  name: '@deepseek-ai/dsh-client-ui-layout'
  disabled: true

# @convax/ui owns the default settings shell and keeps the feature-owned
# settings.section / settings.general.item extension seats intact.
- id: ui-settings-general
  name: '@deepseek-ai/dsh-client-ui-settings-general'
  disabled: true

- id: ui-workspace
  name: '@deepseek-ai/dsh-client-ui-workspace'
  disabled: true

- insert:
    - id: app-agent-presets
      name: '@convax/agent-presets'
      config:
        default: standard

    - id: app-auth-fence
      name: '@convax/auth-fence'
      inject: [webStartup]
      config:
        host: 127.0.0.1
        port: 0

    - id: app-command-guard
      name: '@convax/command-guard'

    - id: app-desktop-host
      name: '@convax/desktop'
      config:
        profile: default

    - id: app-sqlite-runtime
      name: '@convax/sqlite-runtime'

    - id: app-runtime
      name: '@convax/runtime'
      config:
        profile: default

    - id: app-ui
      name: '@convax/ui'

    - id: app-project
      name: '@convax/project'

    - id: app-canvas-store-sqlite
      name: '@convax/canvas-store-sqlite'

    - id: app-canvas
      name: '@convax/canvas'

    - id: app-canvas-builtins
      name: '@convax/canvas-builtins'

    # Keep the third-party package's canonical row id so its diagnostics and
    # keyed Plugin configuration surface identify the official provider.
    - id: llm-openai-codex
      name: dsh-codex-connect
      config:
        enableProxy: false
        enableSearch: true
        enableImageTool: true
        enableImageGeneration: true
