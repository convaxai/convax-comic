# Product-owned final overlay. DSH applies this after the writable profile and
# home patch layers, including on hot reload, so those layers cannot weaken the
# control-plane fence or the conservative agent permission posture.
- id: webserver
  name: '@deepseek-ai/dsh-host-webserver'
  disabled: true
  config:
    host: 127.0.0.1
    port: 0

- id: web-runtime
  name: '@deepseek-ai/dsh-web-app'
  config:
    openBrowser: false
    printUrl: false
    surfaceContext: true
    trustedHosts: []

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: workspace-write

- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: ask

- id: permission
  name: '@deepseek-ai/dsh-permission-presets'
  config:
    defaultPreset: workspace-write
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask

- id: agent-presets
  name: '@deepseek-ai/dsh-agent-presets'
  disabled: true

- id: app-agent-presets
  name: '@convax/agent-presets'
  disabled: false
  config:
    default: standard

- id: app-auth-fence
  name: '@convax/auth-fence'
  disabled: false
  inject: [webStartup]
  config:
    host: 127.0.0.1
    port: 0

- id: app-command-guard
  name: '@convax/command-guard'
  disabled: false
